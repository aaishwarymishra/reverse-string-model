dataset:
  size: 10000
  val_size: 1000
  min: 5
  max: 100
  fixed_length: null
  batch_size: 64
  train_split: 0.8
  shuffle: true

model:
  num_layers: 2
  embed_dim: 128
  intermediate: 512
  heads: 4

optimizer:
  path: torch.optim.Adam
  args:
    lr: 1.0e-3

scheduler:
  path: torch.optim.lr_scheduler.CosineAnnealingLR
  event: ITERATION_COMPLETED
  handler_args: {}
  args:
    T_max: 1570
    eta_min: 1.0e-6

loss_fn:
  path: helper.get_loss_fn

metrics:
  path: helper.get_metrics

trainer:
  device: cuda
  run_args:
    max_epochs: 10

evaluation:
  enabled: true

handlers:
  log_every: 100
  log_metrics: true
  checkpoints:
    best:
      enabled: true
      target: val_evaluator
      event: COMPLETED
      dirname: "checkpoint"
      n_saved: 2
      filename_prefix: "best"
      score_function: "lambda engine: engine.state.metrics['accuracy']"
      score_name: "accuracy"
      global_step_transform: "lambda engine, event: engine.state.epoch"
      to_save: ["model", "optimizer", "scheduler"]
    latest:
      enabled: true
      target: trainer
      event: EPOCH_COMPLETED
      dirname: "checkpoint"
      n_saved: 1
      filename_prefix: "latest"
      global_step_transform: "lambda engine, event: engine.state.epoch"
      to_save: ["model"]
    periodic:
      enabled: true
      target: trainer
      event:
        name: EPOCH_COMPLETED
        every: 5
      dirname: "checkpoint"
      n_saved: 3
      filename_prefix: "periodic"
      global_step_transform: "lambda engine, event: engine.state.epoch"
      to_save: ["model"]
  early_stopping:
    enabled: true
    target: val_evaluator
    event: COMPLETED
    patience: 3
    score_function: "lambda engine: -engine.state.metrics['loss']"
    min_delta: 0.001
  tensorboard:
    enabled: true
    log_dir: "./tb-logs"
    batch_loss_tag: "training"
    metric_names: ["accuracy", "loss"]
    global_step_transform: "lambda engine, event: engine.state.iteration"
    log_optimizer_params: true
